<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Collector — British Pennies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <h1>Coin Collector</h1>
      <div class="subtitle">British Pennies, Victoria to date</div>
    </div>
    <div class="header-right">
      <div id="cash-display" class="cash-display">£0.00</div>
      <div id="stat-line" class="stat-line"></div>
      <button id="messages-btn" class="btn btn-outline btn-small messages-btn" data-action="toggle-messages">
        Messages <span id="messages-badge" class="messages-badge" hidden></span>
      </button>
      <button class="btn btn-outline btn-small" data-action="reset-save">Reset</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel shop-panel">
      <h2>Buy Coins</h2>
      <div id="lot-list" class="card-list"></div>
      <h2>Upgrades</h2>
      <div id="upgrade-list" class="card-list"></div>
    </section>

    <section class="panel tray-panel">
      <div class="tray-header">
        <h2>Grade Tray <span id="grading-tray-count" class="tray-count"></span></h2>
      </div>
      <div id="grading-tray-list" class="tray-grid grading-tray-grid"></div>

      <div class="tray-header inspection-tray-header">
        <h2>Inspection Tray <span id="tray-count" class="tray-count"></span></h2>
        <div class="tray-actions">
          <button id="send-to-grading-btn" class="btn btn-small btn-primary" data-action="send-selected-to-grading" disabled>Send to Grade Tray (0)</button>
        </div>
      </div>
      <div class="tray-toolbar">
        <div class="tray-toolbar-group">
          <span class="tray-toolbar-label">Sort</span>
          <button class="btn btn-small" data-action="sort-tray" data-id="value">Value</button>
          <button class="btn btn-small" data-action="sort-tray" data-id="grade">Grade</button>
          <button class="btn btn-small" data-action="sort-tray" data-id="needed">Needed</button>
        </div>
        <div class="tray-toolbar-group">
          <button class="btn btn-small" data-action="keep-needed">Keep &amp; Replace Needed</button>
          <button class="btn btn-small btn-outline" data-action="sell-duplicates">Sell Graded Duplicates</button>
        </div>
      </div>
      <div id="tray-list" class="tray-grid"></div>
    </section>

    <section class="panel collection-panel">
      <h2>Collection Album</h2>
      <div id="collection-groups"></div>
    </section>
  </main>

  <div id="toasts" class="toasts"></div>

  <div id="messages-modal" class="modal-overlay" hidden>
    <div class="modal messages-modal">
      <div class="modal-header">
        <h2>Messages</h2>
        <button class="btn btn-small btn-outline" data-action="close-messages">Close</button>
      </div>
      <div class="messages-body">
        <div id="messages-list" class="messages-list"></div>
        <div id="messages-reader" class="messages-reader"></div>
      </div>
    </div>
  </div>

  <script src="js/coins.js"></script>
  <script src="js/lots.js"></script>
  <script src="js/upgrades.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/state.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/pixelcoin.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
